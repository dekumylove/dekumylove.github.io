name: Refresh Academic Data

on:
  schedule:
    - cron: '0 0 1 * *'   # Monthly: 1st day of each month
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch academic data from Semantic Scholar
        run: |
          node -e "
          const fs = require('fs');
          async function main() {
            const papers = [];
            let offset = 0;
            const authorId = JSON.parse(fs.readFileSync('src/data/profile.json','utf8')).scholar_author_id || '2327911002';
            while (true) {
              const url = new URL('https://api.semanticscholar.org/graph/v1/author/' + authorId + '/papers');
              url.searchParams.set('fields', 'title,authors,year,venue,citationCount,externalIds');
              url.searchParams.set('limit', '500');
              url.searchParams.set('offset', String(offset));
              const res = await fetch(url.toString());
              if (!res.ok) break;
              const json = await res.json();
              for (const item of json.data) {
                papers.push({
                  paperId: item.paperId,
                  title: item.title || 'Untitled',
                  authors: item.authors || [],
                  year: item.year || null,
                  venue: item.venue || null,
                  citationCount: item.citationCount || 0,
                  externalIds: item.externalIds || {},
                  url: item.externalIds?.DOI ? 'https://doi.org/' + item.externalIds.DOI : item.externalIds?.ArXiv ? 'https://arxiv.org/abs/' + item.externalIds.ArXiv : 'https://www.semanticscholar.org/paper/' + item.paperId,
                });
              }
              if (!json.next) break;
              offset = json.next;
            }
            const filtered = papers.filter(p => p.year != null).sort((a,b) => (b.year||0) - (a.year||0));
            fs.writeFileSync('src/data/academic.json', JSON.stringify(filtered, null, 2) + '\n');
            console.log('Fetched ' + filtered.length + ' papers');
          }
          main();
          "
      - name: Check for changes
        id: git-check
        run: |
          if [[ -n "$(git status --porcelain src/data/academic.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "Academic Bot"
          git config user.email "bot@example.com"
          git add src/data/academic.json
          git commit -m "chore: refresh academic data [skip ci]"
          git push
